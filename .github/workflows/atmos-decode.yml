# Builds the linux-atmos decoders as native Linux executables and publishes them on the
# "atmos-decode-latest" release, where linux-atmos/install.sh downloads them from:
#   atmos-decode  E-AC-3 Atmos (Cavern 2.1 + linux-atmos CPU patch, .NET NativeAOT: needs only libc)
#   thd-atmos     TrueHD Atmos (Rust, truehd crate)
name: atmos-decode

on:
  push:
    paths:
      - linux-atmos/decoder/**
      - linux-atmos/thd-atmos/**
      - .github/workflows/atmos-decode.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atmos-decode-release
  cancel-in-progress: false

jobs:
  atmos-decode:
    # Oldest supported runner: the binaries need glibc >= 2.35
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Install NativeAOT toolchain
        run: sudo apt-get update -qq && sudo apt-get install -y -qq clang zlib1g-dev ffmpeg

      - name: Fetch and patch Cavern
        run: linux-atmos/decoder/cavern/get-cavern.sh

      - name: Build
        working-directory: linux-atmos/decoder
        env:
          DOTNET_NOLOGO: 1
          DOTNET_CLI_TELEMETRY_OPTOUT: 1
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist"
          aot="-c Release -r linux-x64"
          # x86-64-v3 (AVX2, Haswell/Zen and newer) is ~20% faster
          dotnet publish $aot -p:IlcInstructionSet=x86-x64-v3 -o out-v3
          # Baseline x86-64 fallback (the default instruction set)
          rm -rf bin obj
          dotnet publish $aot -o out-baseline
          cp out-v3/atmos-decode "$GITHUB_WORKSPACE/dist/atmos-decode-linux-x64-v3"
          cp out-baseline/atmos-decode "$GITHUB_WORKSPACE/dist/atmos-decode-linux-x64"

      - name: Smoke test
        working-directory: dist
        run: |
          set -euo pipefail
          ffmpeg -v error -f lavfi -i "sine=f=440:d=1" -ac 6 -c:a eac3 -b:a 384k -f eac3 test.eac3
          for bin in atmos-decode-linux-x64 atmos-decode-linux-x64-v3; do
            chmod +x "$bin"
            "./$bin" --info test.eac3
            bytes=$("./$bin" test.eac3 | wc -c)
            echo "$bin: $bytes bytes"
            test "$bytes" -gt 1000000
            "./$bin" --mka 1.5 - < test.eac3 > test.mka
            ffprobe -v error -show_entries stream=channel_layout:format=start_time -of compact test.mka | tee probe.txt
            # FFmpeg < 5.1 has no name for 7.1.4 and lists the channels instead
            grep -Eq "channel_layout=(7\.1\.4|.*FL\+FR\+FC\+LFE\+BL\+BR\+SL\+SR\+TFL\+TFR\+TBL\+TBR)" probe.txt
          done
          rm test.eac3 test.mka probe.txt

      - uses: actions/upload-artifact@v4
        with:
          name: atmos-decode
          path: dist/

  thd-atmos:
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v5

      # Compiling thd-atmos takes ~5 minutes, so the released binary is reused while its source
      # (and this job's build settings, the "v1" below) stay the same.
      - name: Reuse the released build if the source is unchanged
        id: reuse
        run: |
          set -euo pipefail
          cd linux-atmos/thd-atmos
          hash=$( { echo v1; cat Cargo.toml Cargo.lock; find src -type f | sort | xargs cat; } | sha256sum | cut -d' ' -f1)
          echo "$hash" > "$GITHUB_WORKSPACE/thd-atmos.source"
          mkdir -p "$GITHUB_WORKSPACE/prev"
          if gh release download atmos-decode-latest -p thd-atmos-linux-x64 -p thd-atmos.source \
                -D "$GITHUB_WORKSPACE/prev" 2>/dev/null &&
             [[ $(cat "$GITHUB_WORKSPACE/prev/thd-atmos.source") == "$hash" ]]; then
            echo "Source unchanged since the released build ($hash): reusing it"
            echo "bin=$GITHUB_WORKSPACE/prev/thd-atmos-linux-x64" >> "$GITHUB_OUTPUT"
            chmod +x "$GITHUB_WORKSPACE/prev/thd-atmos-linux-x64"
          else
            echo "Source changed (or no released build): compiling"
            echo "bin=$GITHUB_WORKSPACE/linux-atmos/thd-atmos/target/release/thd-atmos" >> "$GITHUB_OUTPUT"
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Rust
        if: steps.reuse.outputs.build == 'true'
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - name: Build
        if: steps.reuse.outputs.build == 'true'
        working-directory: linux-atmos/thd-atmos
        # One job: compiling the truehd crate optimised peaks at ~11 GB of RAM (runners have 16)
        run: cargo build --release --locked -j 1

      - name: Smoke test
        run: |
          set -euo pipefail
          bin="${{ steps.reuse.outputs.bin }}"
          "$bin" --positions
          # 2 s of 5.1 TrueHD encoded with FFmpeg 6.1 (a stream encoded on this runner with FFmpeg 4.4
          # gave no output) -> 2 s x 48 kHz x 12 channels x 4 bytes
          bytes=$("$bin" < linux-atmos/thd-atmos/tests/sine-5.1.thd | wc -c)
          echo "thd-atmos: $bytes bytes"
          test "$bytes" -eq 4608000
          mkdir -p dist && cp "$bin" dist/thd-atmos-linux-x64 && cp thd-atmos.source dist/

      - uses: actions/upload-artifact@v4
        with:
          name: thd-atmos
          path: dist/

  release:
    needs: [atmos-decode, thd-atmos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd dist
          sha256sum atmos-decode-* thd-atmos-* > SHA256SUMS
          cat SHA256SUMS
          tag=atmos-decode-latest
          notes="Native linux-atmos decoders built from ${GITHUB_SHA} (${GITHUB_REF_NAME}).

          atmos-decode uses Cavern by VoidX (http://en.sbence.hu, https://github.com/VoidXH/Cavern), version 2.1
          with the CPU patch in linux-atmos/decoder/cavern/joc-cpu.patch. Free for non-commercial use under
          Cavern's licence: https://github.com/VoidXH/Cavern/blob/master/LICENSE.md
          thd-atmos uses the truehd crate (https://crates.io/crates/truehd)."
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --notes "$notes"
          else
            gh release create "$tag" --prerelease --target "$GITHUB_SHA" --title "atmos-decode (latest build)" --notes "$notes"
          fi
          gh release upload "$tag" atmos-decode-* thd-atmos-* thd-atmos.source SHA256SUMS --clobber
